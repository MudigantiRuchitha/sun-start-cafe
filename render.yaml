services:
  - type: web
    name: sun-star-cafe
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: HOST
        value: 0.0.0.0
      - key: PHONEPE_ENV
        value: SANDBOX
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CAFE_NOTIFICATION_EMAIL
        sync: false
